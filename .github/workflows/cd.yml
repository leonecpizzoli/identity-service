name: cd

# Roda depois que o ci termina com sucesso em main. O workflow_dispatch existe
# para reexecutar o deploy sem precisar de um novo commit.
#
# O evento workflow_run so e avaliado a partir do arquivo que esta na branch
# padrao do repositorio: enquanto este cd.yml nao estiver em main, o gatilho
# automatico nao existe.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo "sha=${COMMIT_SHA}"
            echo "image=${REGISTRY}/${repository}:${COMMIT_SHA}"
            echo "repository=${repository}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publica identity-service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      IMAGE_IDENTITY: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: baixa a imagem publicada
        # O deploy usa exatamente o artefato do registry, nao um build local.
        run: docker pull "$IMAGE_IDENTITY"
      - name: cria o cluster efemero
        uses: helm/kind-action@v1
        with:
          cluster_name: identity-service
          config: k8s/kind-cluster.yaml
      - name: aplica os manifests
        run: ./scripts/deploy-kind.sh
      - name: smoke test do ambiente implantado
        run: ./scripts/smoke-test.sh
      - name: coleta diagnostico do cluster
        if: always()
        run: |
          mkdir -p diagnostics
          kubectl get all -n vehicle-resale > diagnostics/resources.txt 2>&1 || true
          kubectl describe pods -n vehicle-resale > diagnostics/pods.txt 2>&1 || true
          kubectl get events -n vehicle-resale --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          for deployment in identity-service mongo-identity; do
            kubectl logs -n vehicle-resale "deployment/${deployment}" --all-containers --tail=500 \
              > "diagnostics/${deployment}.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-diagnostics-${{ needs.publish.outputs.sha }}
          path: diagnostics
          retention-days: 7
