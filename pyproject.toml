[project]
name = "identity-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "pymongo>=4.11.0",
    "pyjwt>=2.10.1",
    "cryptography>=44.0.0",
    "argon2-cffi>=23.1.0",
    "prometheus-client>=0.21.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "asgi-lifespan>=2.1.0",
    "testcontainers>=4.9.0",
    "ruff>=0.9.4",
    "mypy>=1.14.1",
    "bandit[toml]>=1.8.2",
    "pip-audit>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "C90",
    "SIM",
    "ASYNC",
    "S",
    "DTZ",
    "ERA",
    "T20",
    "RUF",
    "PLE",
    "PLW",
    "RET",
    "PTH",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["identity_service"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires docker"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
